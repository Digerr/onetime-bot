<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАН-ТАЙМ</title>
    <style>
        :root { --bg: #0a0e14; --card: #12181f; --text: #e0e0e0; --accent: #00ff88; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
        .header { background: #0a0e14; padding: 15px; text-align: center; font-size: 22px; font-weight: 900; color: var(--accent); }
        .live-bar { background: #1a1f2e; padding: 10px; text-align: center; font-weight: bold; color: #00ff88; }
        .tab-bar { display: flex; background: #12181f; position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: 600; }
        .tab.active { border-bottom: 3px solid var(--accent); color: var(--accent); }
        .content { padding: 15px; max-width: 640px; margin: 0 auto; }
        .match-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .team { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .score { font-size: 28px; font-weight: 900; color: var(--accent); }
        .news-card { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
        .news-img { width: 100%; height: 180px; object-fit: cover; }
        .news-body { padding: 15px; }
    </style>
</head>
<body>
    <div class="header">⚽ ВАН-ТАЙМ</div>
    <div class="live-bar">🔴 LIVE • 8 матчей сейчас</div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab(0)">LIVE</div>
        <div class="tab" onclick="switchTab(1)">МАТЧИ</div>
        <div class="tab" onclick="switchTab(2)">ТАБЛИЦЫ</div>
        <div class="tab" onclick="switchTab(3)">НОВОСТИ</div>
    </div>

    <div class="content" id="content">
        <!-- сюда будет подгружаться контент через JS -->
    </div>

    <script>
        async function loadNews() {
            const res = await fetch('/api/news');
            const data = await res.json();
            let html = data.map(n => `
                <div class="news-card">
                    <img class="news-img" src="${n.image}" onerror="this.style.display='none'">
                    <div class="news-body">
                        <small>${n.tag} • ${n.time}</small>
                        <h3>${n.title}</h3>
                        <p>${n.desc}</p>
                    </div>
                </div>
            `).join('');
            document.getElementById('content').innerHTML = html || '<p style="text-align:center;color:#666;padding:50px;">Новостей пока нет</p>';
        }

        function switchTab(n) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[n].classList.add('active');
            if (n === 3) loadNews();
            // можно добавить другие табы позже
        }

        // первый запуск
        window.onload = () => loadNews();
    </script>
</body>
</html>
