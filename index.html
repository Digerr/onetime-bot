<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>ВАН-ТАЙМ</title>
    <style>
        :root { --bg-color: #000; --text-color: #fff; --accent: #32d74b; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; padding-bottom: 80px; }
        .card { background: #121212; border-radius: 16px; margin: 15px; padding: 15px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #1a1a1a; padding: 10px; }
        .b-nav-item { flex: 1; text-align: center; color: #fff; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="tab-news" class="tab-content active">
        <div id="news-container">Загрузка ленты...</div>
    </div>

    <div class="bottom-nav">
        <button class="b-nav-item" onclick="switchTab('tab-news')">📰 Лента</button>
        <button class="b-nav-item" onclick="alert('LIVE')">🔥 LIVE</button>
    </div>

    <script>
        async function loadNews() {
            let res = await fetch('/api/news');
            let data = await res.json();
            document.getElementById('news-container').innerHTML = data.map(n => `
                <div class="card">
                    <img src="${n.image}" style="width:100%; border-radius:10px;">
                    <h3>${n.title}</h3>
                    <p>${n.desc}</p>
                </div>
            `).join('');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        loadNews();
    </script>
</body>
</html>
