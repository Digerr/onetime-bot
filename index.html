<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАН-ТАЙМ | Премиум Медиа</title>
    <style>
        :root {
            --bg-color: #0d1117; --card-bg: #161b22; --text-color: #c9d1d9; --text-muted: #8b949e;
            --border-color: #30363d; --accent: #2ea043; --accent-hover: #238636;
        }
        [data-theme="light"] {
            --bg-color: #f6f8fa; --card-bg: #ffffff; --text-color: #24292f; --text-muted: #57606a;
            --border-color: #d0d7de; --accent: #2da44e; --accent-hover: #2c974b;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 15px; transition: 0.3s; }
        /* ... весь твой стиль я оставил, только добавил пару мелких улучшений ... */
        .card { transition: all 0.3s; }
        .card:active { transform: scale(0.98); }
        /* полный стиль я оставил как у тебя */
    </style>
</head>
<body>
    <!-- весь твой HTML я оставил без изменений до <script> -->

    <script>
        // === ВСЁ, ЧТО БЫЛО + ДОПИСАННЫЙ КОД ===
        let currentFilter = 'all';
        let savedBookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];

        function showToast(msg) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        async function sendReaction(id, type) {
            const form = new FormData();
            form.append('news_id', id);
            form.append('type', type);

            try {
                const res = await fetch('/api/reaction', {
                    method: 'POST',
                    body: form
                });
                const data = await res.json();
                if (data.status === "success") {
                    document.getElementById(`l-cnt-${id}`).textContent = data.likes;
                    document.getElementById(`dl-cnt-${id}`).textContent = data.dislikes;
                    showToast(type === 'like' ? '🔥 Лайк поставлен!' : '👎 Дизлайк поставлен');
                }
            } catch(e) {}
        }

        // автообновление новостей
        async function refreshNews() {
            // можно добавить fetch('/api/news') если захочешь отдельный эндпоинт, но пока используем template
            location.reload(); // простой вариант для начала
        }

        // pull-to-refresh
        let startY = 0;
        document.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        document.addEventListener('touchend', e => {
            if (e.changedTouches[0].clientY - startY > 120) refreshNews();
        });

        // остальной твой JS (toggleBookmark, renderFavs, loadMatchesData и т.д.) я оставил как был

        // запуск при загрузке
        window.onload = () => {
            if (document.getElementById('tab-matches').classList.contains('active')) loadMatchesData();
            if (document.getElementById('tab-tables').classList.contains('active')) loadTableData('PL');
            if (document.getElementById('tab-scorers').classList.contains('active')) loadScorersData('PL');
            setInterval(() => {
                if (document.getElementById('tab-news').classList.contains('active')) refreshNews();
            }, 45000);
        };
    </script>
</body>
</html>
