<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАН-ТАЙМ</title>
    <style>
        :root { --bg: #0a0e14; --card: #12181f; --text: #e0e0e0; --accent: #00ff88; --muted: #8a8f9c; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
        .header { background:#0a0e14; padding:15px 20px; display:flex; align-items:center; gap:10px; font-size:24px; font-weight:900; color:var(--accent); position:sticky; top:0; z-index:100; }
        .live-bar { background:#1a222f; padding:10px 20px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--accent); }
        .tab-bar { display:flex; background:#12181f; position:sticky; top:57px; z-index:99; border-bottom:1px solid #1f2837; }
        .tab { flex:1; padding:16px 10px; text-align:center; font-weight:700; font-size:15px; color:var(--muted); }
        .tab.active { color:var(--accent); border-bottom:3px solid var(--accent); }
        .content { padding:15px; max-width:640px; margin:0 auto; }
        .search { width:100%; padding:14px 20px; background:#1a222f; border:none; border-radius:9999px; color:white; margin-bottom:15px; font-size:15px; }
        .match-card, .news-card { background:var(--card); border-radius:12px; margin-bottom:12px; overflow:hidden; }
        .match-header { padding:10px 15px; display:flex; justify-content:space-between; font-size:13px; color:var(--muted); background:#1a222f; }
        .match-teams { display:flex; justify-content:space-between; align-items:center; padding:15px; }
        .team { display:flex; align-items:center; gap:10px; font-weight:600; }
        .team-logo { width:34px; height:34px; object-fit:contain; }
        .score { font-size:32px; font-weight:900; color:var(--accent); }
        .news-img { width:100%; height:190px; object-fit:cover; }
        .news-body { padding:15px; }
        .news-tag { color:var(--accent); font-size:13px; font-weight:700; margin-bottom:6px; }
        .interact { display:flex; gap:15px; margin-top:10px; }
        .react-btn { background:#1a222f; color:var(--muted); border:none; padding:6px 14px; border-radius:8px; font-size:15px; cursor:pointer; }
        .empty { text-align:center; padding:80px 20px; color:var(--muted); }
    </style>
</head>
<body>
    <div class="header">⚽ ВАН-ТАЙМ</div>
    <div class="live-bar">🔴 LIVE • <span id="live-count">Загрузка...</span></div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab(0)">LIVE</div>
        <div class="tab" onclick="switchTab(1)">МАТЧИ</div>
        <div class="tab" onclick="switchTab(2)">ТАБЛИЦЫ</div>
        <div class="tab" onclick="switchTab(3)">НОВОСТИ</div>
    </div>

    <div class="content" id="content"></div>

    <script>
        let currentTab = 0;

        async function loadLive() {
            const res = await fetch('/api/matches');
            const data = await res.json();
            document.getElementById('live-count').innerHTML = data.length + ' матчей';
            let html = data.map(m => `
                <div class="match-card">
                    <div class="match-header"><span>\( {m.league}</span><span style="color:#ff4444"> \){m.status}</span></div>
                    <div class="match-teams">
                        <div class="team"><img src="\( {m.home_img}" class="team-logo" onerror="this.style.display='none'"><span> \){m.home}</span></div>
                        <div class="score">${m.score}</div>
                        <div class="team"><span>\( {m.away}</span><img src=" \){m.away_img}" class="team-logo" onerror="this.style.display='none'"></div>
                    </div>
                </div>
            `).join('');
            document.getElementById('content').innerHTML = html || '<div class="empty">Матчей нет</div>';
        }

        async function loadNews() {
            const res = await fetch('/api/news');
            const news = await res.json();
            let html = news.map(n => `
                <div class="news-card">
                    <img class="news-img" src="${n.image}" onerror="this.style.display='none'">
                    <div class="news-body">
                        <div class="news-tag">${n.tag} • ${n.time}</div>
                        <h3 style="margin:8px 0 8px">${n.title}</h3>
                        <p style="color:var(--muted);line-height:1.4">${n.desc}</p>
                        <div class="interact">
                            <button class="react-btn" onclick="sendReaction('\( {n.id}','like')">🔥 <span id="l- \){n.id}">0</span></button>
                            <button class="react-btn" onclick="sendReaction('\( {n.id}','dislike')">👎 <span id="d- \){n.id}">0</span></button>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('content').innerHTML = html || '<div class="empty">Новостей пока нет</div>';
        }

        async function sendReaction(id, type) {
            const form = new FormData();
            form.append('news_id', id);
            form.append('type', type);
            const res = await fetch('/api/reaction', {method:'POST', body:form});
            const data = await res.json();
            if (data.status === "success") {
                document.getElementById('l-'+id).textContent = data.likes;
                document.getElementById('d-'+id).textContent = data.dislikes;
            }
        }

        function switchTab(n) {
            currentTab = n;
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
            if (n === 0) loadLive();
            if (n === 3) loadNews();
        }

        setInterval(() => { if (currentTab === 0) loadLive(); if (currentTab === 3) loadNews(); }, 40000);
        window.onload = loadLive;
    </script>
</body>
</html>
