<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВАН-ТАЙМ | App</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #121212; --text-color: #ffffff; --text-muted: #8e8e93;
            --border-color: #2c2c2e; --accent: #32d74b; --accent-hover: #2db33e;
            --bottom-nav-bg: rgba(18, 18, 18, 0.9); --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 90px; }
        
        .top-bar { position: sticky; top: 0; z-index: 100; background: var(--bg-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .header { color: var(--accent); font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
        .live-indicator { background: #1a222f; padding: 10px 20px; font-weight: 700; font-size: 14px; color: var(--accent); border-bottom: 1px solid var(--border-color); }

        .tab-content { display: none; padding: 15px; max-width: 600px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .search-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 14px 20px; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 15px; }
        
        .chips-wrapper { overflow-x: auto; white-space: nowrap; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; display: flex; gap: 8px; }
        .chips-wrapper::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .news-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .card.hidden { display: none; }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 16px; }
        .card-tag { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display: inline-block; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .card-desc { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); padding-top: 12px; border-top: 1px solid var(--border-color); }
        .tg-link-btn { background: rgba(50, 215, 75, 0.15); color: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: 700; text-decoration: none; }

        .interact-row { display: flex; gap: 12px; margin-top: 12px; }
        .react-btn { background: #1a222f; color: #fff; border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }

        .match-card { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; margin-bottom: 10px; }
        .league-info { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 600; }
        .status-badge { color: var(--accent); font-weight: 700; }
        .status-badge.live { color: #ff453a; }
        .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
        .team-block { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; text-align: center; }
        .team-logo { width: 35px; height: 35px; object-fit: contain; }
        .match-score { font-size: 22px; font-weight: 900; background: #1a1a1a; padding: 4px 14px; border-radius: 8px; border: 1px solid var(--border-color); }

        .pro-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .pro-table th { color: var(--text-muted); padding: 12px 5px; border-bottom: 1px solid var(--border-color); font-weight: 500; font-size: 12px; text-align: center; }
        .pro-table td { padding: 14px 5px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .team-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; text-align: left; }
        .t-logo { width: 20px; height: 20px; object-fit: contain; }

        .skeleton { background: linear-gradient(90deg, var(--card-bg) 25%, #2c2c2e 50%, var(--card-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; height: 100px; margin-bottom: 12px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bottom-nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .b-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); background: none; border: none; cursor: pointer; font-size: 11px; font-weight: 600; flex: 1; outline: none; }
        .b-nav-icon { font-size: 20px; }
        .b-nav-item.active { color: var(--accent); }

        #toast { visibility: hidden; min-width: 180px; background: var(--text-color); color: var(--bg-color); text-align: center; border-radius: 20px; padding: 10px 20px; position: fixed; z-index: 1001; left: 50%; bottom: 100px; transform: translateX(-50%); font-weight: 700; font-size: 13px; }
        #toast.show { visibility: visible; animation: f-in 0.3s, f-out 0.3s 1.7s forwards; }
        @keyframes f-in { from { bottom: 80px; opacity: 0; } to { bottom: 100px; opacity: 1; } }
        @keyframes f-out { from { bottom: 100px; opacity: 1; } to { bottom: 80px; opacity: 0; } }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="header">⚽ ВАН-ТАЙМ</div>
    </div>
    <div class="live-indicator">🔴 LIVE матчи: <span id="live-count-badge">0</span></div>
    
    <div id="toast">Действие выполнено</div>

    <div id="tab-news" class="tab-content active">
        <input type="text" id="search-input" class="search-input" oninput="liveSearch()" placeholder="🔍 Поиск новостей, клубов...">
        <div class="chips-wrapper">
            <div class="filter-btn active" onclick="filterNews('all', this)">Все</div>
            <div class="filter-btn" onclick="filterNews('#Трансферы', this)">Трансферы</div>
            <div class="filter-btn" onclick="filterNews('#РПЛ', this)">РПЛ</div>
            <div class="filter-btn" onclick="filterNews('#АПЛ', this)">АПЛ</div>
        </div>
        <div id="news-container" class="news-container">Загрузка ленты...</div>
    </div>

    <div id="tab-matches" class="tab-content">
        <div id="matches-live-box" class="news-container"></div>
    </div>

    <div id="tab-schedule" class="tab-content">
        <div id="matches-all-box" class="news-container"></div>
    </div>

    <div id="tab-tables" class="tab-content">
        <div class="chips-wrapper">
            <div class="filter-btn active" onclick="loadTableData('RPL', this)">РПЛ 🇷🇺</div>
            <div class="filter-btn" onclick="loadTableData('PL', this)">Англия</div>
            <div class="filter-btn" onclick="loadTableData('PD', this)">Испания</div>
            <div class="filter-btn" onclick="loadTableData('SA', this)">Италия</div>
            <div class="filter-btn" onclick="loadTableData('BL1', this)">Германия</div>
            <div class="filter-btn" onclick="loadTableData('FL1', this)">Франция</div>
        </div>
        <div style="background: var(--card-bg); border-radius: 16px; padding: 10px; border: 1px solid var(--border-color); overflow-x: auto;">
            <table class="pro-table">
                <thead><tr><th>#</th><th style="text-align:left;">Клуб</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>О</th></tr></thead>
                <tbody id="table-body-async"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-scorers" class="tab-content">
        <div class="chips-wrapper">
            <div class="filter-btn active" onclick="loadScorersData('RPL', this)">РПЛ 🇷🇺</div>
            <div class="filter-btn" onclick="loadScorersData('PL', this)">Англия</div>
            <div class="filter-btn" onclick="loadScorersData('PD', this)">Испания</div>
            <div class="filter-btn" onclick="loadScorersData('SA', this)">Италия</div>
            <div class="filter-btn" onclick="loadScorersData('BL1', this)">Германия</div>
        </div>
        <div style="background: var(--card-bg); border-radius: 16px; padding: 10px; border: 1px solid var(--border-color);">
            <table class="pro-table">
                <thead><tr><th style="text-align:left;">Игрок</th><th style="text-align:left;">Клуб</th><th>⚽</th><th>🅰️</th></tr></thead>
                <tbody id="scorers-body-async"></tbody>
            </table>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="b-nav-item active" onclick="switchAppTab('tab-news', this)">
            <span class="b-nav-icon">📰</span><span>Лента</span>
        </button>
        <button class="b-nav-item" onclick="switchAppTab('tab-matches', this)">
            <span class="b-nav-icon">🔴</span><span>LIVE</span>
        </button>
        <button class="b-nav-item" onclick="switchAppTab('tab-schedule', this)">
            <span class="b-nav-icon">🗓️</span><span>Матчи</span>
        </button>
        <button class="b-nav-item" onclick="switchAppTab('tab-tables', this)">
            <span class="b-nav-icon">🏆</span><span>Лиги</span>
        </button>
        <button class="b-nav-item" onclick="switchAppTab('tab-scorers', this)">
            <span class="b-nav-icon">👟</span><span>Топ-10</span>
        </button>
    </div>

    <script>
        let currentFilter = 'all';

        function showToast(msg) {
            let t = document.getElementById("toast"); t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 1800);
        }

        async function updateLiveBadge() {
            try {
                let res = await fetch('/api/matches/live');
                let data = await res.json();
                document.getElementById('live-count-badge').innerText = data.length;
            } catch(e) {}
        }

        async function loadNews() {
            try {
                let res = await fetch('/api/news');
                let data = await res.json();
                document.getElementById('news-container').innerHTML = data.map(n => `
                    <div class="card" data-tag="${n.tag}" id="news-${n.id}">
                        <img class="card-img" src="${n.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2'">
                        <div class="card-body">
                            <span class="card-tag">${n.tag}</span>
                            <h2 class="card-title">${n.title}</h2>
                            <div class="card-desc">${n.desc}</div>
                            <div class="card-footer">
                                <span>🕒 ${n.time} | ${n.source}</span>
                                <a href="https://t.me/onetime_foot" target="_blank" class="tg-link-btn">В канал ↗</a>
                            </div>
                            <div class="interact-row">
                                <button class="react-btn" onclick="sendReaction('${n.id}', 'like')">🔥 <span id="l-${n.id}">${n.likes}</span></button>
                                <button class="react-btn" onclick="sendReaction('${n.id}', 'dislike')">👎 <span id="d-${n.id}">${n.dislikes}</span></button>
                            </div>
                        </div>
                    </div>
                `).join('');
                liveSearch();
            } catch(e) { document.getElementById('news-container').innerText = "Ошибка загрузки ленты."; }
        }

        async function loadOnlyLiveMatches() {
            document.getElementById('matches-live-box').innerHTML = '<div class="skeleton"></div>';
            try {
                let res = await fetch('/api/matches/live');
                let data = await res.json();
                document.getElementById('matches-live-box').innerHTML = data.map(m => `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="league-info">${m.league}</div>
                            <div class="status-badge live">${m.status}</div>
                        </div>
                        <div class="match-teams">
                            <div class="team-block"><img src="${m.home_img}" class="team-logo" onerror="this.style.display='none'"> <span>${m.home}</span></div>
                            <div class="match-score">${m.score}</div>
                            <div class="team-block"><img src="${m.away_img}" class="team-logo" onerror="this.style.display='none'"> <span>${m.away}</span></div>
                        </div>
                    </div>
                `).join('') || '<div style="text-align:center;padding:40px;color:var(--text-muted);">Прямо сейчас активных матчей нет</div>';
            } catch(e) {}
        }

        async function loadScheduleMatches() {
            document.getElementById('matches-all-box').innerHTML = '<div class="skeleton"></div>';
            try {
                let res = await fetch('/api/matches');
                let data = await res.json();
                document.getElementById('matches-all-box').innerHTML = data.map(m => `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="league-info">${m.league}</div>
                            <div class="status-badge">${m.status}</div>
                        </div>
                        <div class="match-teams">
                            <div class="team-block"><img src="${m.home_img}" class="team-logo" onerror="this.style.display='none'"> <span>${m.home}</span></div>
                            <div class="match-score" style="font-size:18px;">${m.score}</div>
                            <div class="team-block"><img src="${m.away_img}" class="team-logo" onerror="this.style.display='none'"> <span>${m.away}</span></div>
                        </div>
                    </div>
                `).join('') || '<div style="text-align:center;padding:40px;color:var(--text-muted);">Матчей не найдено</div>';
            } catch(e) {}
        }

        async function loadTableData(code, btn) {
            if(btn) { document.querySelectorAll('#tab-tables .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
            document.getElementById('table-body-async').innerHTML = '<tr><td colspan="7">Синхронизация таблицы...</td></tr>';
            try {
                let res = await fetch('/api/tables/' + code);
                let data = await res.json();
                document.getElementById('table-body-async').innerHTML = data.map(t => `
                    <tr>
                        <td style="font-weight:700;color:var(--accent);">${t.pos}</td>
                        <td><div class="team-cell"><img src="${t.crest}" class="t-logo" onerror="this.style.display='none'"> ${t.name}</div></td>
                        <td>${t.games}</td><td>${t.won}</td><td>${t.draw}</td><td>${t.lost}</td><td style="font-weight:700;">${t.points}</td>
                    </tr>
                `).join('');
            } catch(e) {}
        }

        async function loadScorersData(code, btn) {
            if(btn) { document.querySelectorAll('#tab-scorers .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
            document.getElementById('scorers-body-async').innerHTML = '<tr><td colspan="4">Загрузка бомбардиров...</td></tr>';
            try {
                let res = await fetch('/api/scorers/' + code);
                let data = await res.json();
                document.getElementById('scorers-body-async').innerHTML = data.map(s => `
                    <tr>
                        <td style="font-weight:700;text-align:left;">${s.name}</td>
                        <td style="color:var(--text-muted);font-size:12px;text-align:left;">${s.team}</td>
                        <td style="font-weight:800;color:var(--accent);">${s.goals}</td><td>${s.assists}</td>
                    </tr>
                `).join('');
            } catch(e) {}
        }

        function switchAppTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.b-nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(id === 'tab-news') loadNews();
            if(id === 'tab-matches') loadOnlyLiveMatches();
            if(id === 'tab-schedule') loadScheduleMatches();
            if(id === 'tab-tables') loadTableData('RPL');
            if(id === 'tab-scorers') loadScorersData('RPL');
        }

        function liveSearch() {
            let query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#news-container .card').forEach(card => {
                let text = card.innerText.toLowerCase();
                let tag = card.getAttribute('data-tag').toLowerCase();
                if ((currentFilter === 'all' || tag === currentFilter) && text.includes(query)) card.classList.remove('hidden');
                else card.classList.add('hidden');
            });
        }

        function filterNews(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('#tab-news .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); liveSearch();
        }

        async function sendReaction(id, type) {
            let fd = new FormData(); fd.append('news_id', id); fd.append('type', type);
            try {
                let res = await (await fetch('/api/reaction', { method: 'POST', body: fd })).json();
                if(res.status === 'success') {
                    document.getElementById('l-'+id).innerText = res.likes;
                    document.getElementById('d-'+id).innerText = res.dislikes;
                    showToast("Оценка сохранена!");
                }
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => { 
            loadNews();
            updateLiveBadge();
            setInterval(updateLiveBadge, 30000);
        });
    </script>
</body>
</html>
